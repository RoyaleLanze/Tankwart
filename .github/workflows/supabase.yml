name: Supabase

# Database (pgTAP) and Edge Function (Deno) tests, ADR 0007.
# Separate workflow with a paths filter so that app-only PRs stay fast.
on:
  pull_request:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db:
    name: pgTAP (supabase test db)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          # Same version as the devDependency in package-lock.json
          version: 3.2.0

      # Docker is preinstalled on the runner. Services the tests do not need are skipped.
      # start applies migrations and seed.sql.
      - run: supabase start -x studio,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: supabase test db

  functions:
    name: Deno (supabase/functions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Skip cleanly while no Edge Function tests exist yet (#15).
      - id: find
        run: |
          if find supabase/functions -name '*test.ts' 2>/dev/null | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Deno tests in supabase/functions, skipping."
          fi

      - if: steps.find.outputs.has_tests == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          # Same version as `npx deno@2.9.6 test` in the README; deno.lock format v5 needs Deno >= 2.3.
          deno-version: 2.9.6

      # Each function has its own deno.json and deno.lock; --frozen enforces the lockfile hashes.
      - if: steps.find.outputs.has_tests == 'true'
        run: |
          for dir in $(find supabase/functions -name deno.json -exec dirname {} \;); do
            (cd "$dir" && deno test --frozen --allow-env --allow-net --allow-read)
          done
