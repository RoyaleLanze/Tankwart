name: Fehler
description: Etwas funktioniert nicht wie erwartet
labels: ["type:bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Schritte zur Reproduktion
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartet vs. tatsächlich
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Gerät / Emulator, Android-Version
